<!-- TODO 12 - DE HTML FIXO PARA HTML DINÂMICO (faça depois do TODO 11)
     Troque cada valor fixo por um BINDING usando o input contato():
     a) <mat-card>: [class.favorito]="contato().favorito"  e  appDestaque="#e91e63"
     b) <img>: [src]="foto()"  e  [alt]="'Foto de ' + contato().nome"
     c) título: {{ contato().nome }}
     d) subtítulo: @switch (contato().categoria) com @case ('familia') / @case ('trabalho') / @default
        mostrando os ícones family_restroom / work / diversity_3 + {{ contato().categoria | titlecase }}
     e) telefone: {{ contato().telefone | telefone }}     e-mail: {{ contato().email }}
     f) estrela:  (click)="favoritar.emit(contato().id)"  e ícone {{ contato().favorito ? 'star' : 'star_border' }}
     g) detalhes: [routerLink]="['/contatos', contato().id]"
     h) lixeira:  (click)="remover.emit(contato().id)"
-->
<mat-card class="card" [class.favorito]="contato().favorito" appDestaque="#e91e63">
  <img mat-card-image [src]="foto()" [alt]="'Foto de ' + contato().nome" />

  <mat-card-header>
    <mat-card-title>{{ contato().nome }}</mat-card-title>
    <mat-card-subtitle class="categoria">
      @switch (contato().categoria) {
        @case ('familia') {
          <mat-icon>family_restroom</mat-icon>
        }
        @case ('trabalho') {
          <mat-icon>work</mat-icon>
        }
        @default {
          <mat-icon>diversity_3</mat-icon>
        }
      }
      {{ contato().categoria | titlecase }}
    </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <p><mat-icon>call</mat-icon> {{ contato().telefone | telefone }}</p>
    <p><mat-icon>mail</mat-icon> {{ contato().email }}</p>
  </mat-card-content>

  <mat-card-actions>
    <button
      mat-icon-button
      type="button"
      (click)="favoritar.emit(contato().id)"
      [matTooltip]="contato().favorito ? 'Desfavoritar' : 'Favoritar'"
    >
      <mat-icon>{{ contato().favorito ? 'star' : 'star_border' }}</mat-icon>
    </button>

    <a mat-button [routerLink]="['/contatos', contato().id]">Detalhes</a>

    <button mat-icon-button type="button" (click)="remover.emit(contato().id)" matTooltip="Remover">
      <mat-icon>delete</mat-icon>
    </button>
  </mat-card-actions>
</mat-card>
